[tool.poetry]
name = "custom-ilp-ase"
version = "0.1.0"
description = "Custom Account Servicing Entity (ASE) for Interledger / Rafiki — FastAPI backend with a double-entry ledger."
authors = ["pankajhamal <nepalinternetfoundation@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = { extras = ["email"], version = "^2.9.0" }
pydantic-settings = "^2.5.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.30.0"
alembic = "^1.13.0"
httpx = "^0.27.0"
bcrypt = "^4.2.0"
orjson = "^3.10.0"

# --- OpenTelemetry (optional at runtime; always installed) ---
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
opentelemetry-exporter-otlp-proto-grpc = "^1.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
aiosqlite = "^0.20.0"
anyio = "^4.6.0"
ruff = "^0.7.0"
mypy = "^1.13.0"
markdown = "^3.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling configuration
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
