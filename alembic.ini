# Alembic configuration for the Custom ILP ASE.
# The DB URL is injected at runtime from app settings in alembic/env.py,
# so `sqlalchemy.url` below is intentionally left blank.

[alembic]
script_location = alembic
prepend_sys_path = .
# Use OS-native path separators in version file paths.
version_path_separator = os
# Timestamped, slugged migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

sqlalchemy.url =

[post_write_hooks]
# Auto-format generated migrations with ruff.
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys_stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
